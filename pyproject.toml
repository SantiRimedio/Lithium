[project]
name = "lithium-acquisition"
version = "0.1.0"
description = "Methodology v2 Stage 0 data acquisition pipeline"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=0.14",
    "netcdf4>=1.6",
    "pyyaml>=6.0",
    "rasterio>=1.3",
    "requests>=2.31",
    "tenacity>=8.2",
    "xarray>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acquisition"]

[tool.pytest.ini_options]
testpaths = ["tests"]
