- key: spei
  title: "SPEIbase v2.11 — global monthly SPEI"
  url: ""
  version: "v2.11"
  license: "CC-BY 4.0 (per spei.csic.es)"
  clip_to_puna: true
  sha256: ""
  size_bytes: 0
  doi: ""
  handle: ""
  notes: |
    SPEI-12 and SPEI-24 are the climate covariates in Methodology v2 §3.5.
    The Methodology v2 spec's previous DOI (10.1038/s41597-024-03047-z) was
    incorrect — that DOI is Liu et al. 2024 SPEI-GD (daily, 0.25°, 112 GB),
    not the monthly product the methodology specifies. The correct dataset
    is SPEIbase v2.11 (Beguería & Vicente-Serrano), 0.5° monthly 1901–2024,
    timescales 1–48 months. Resolve the direct NetCDF URLs for spei12.nc
    and spei24.nc from https://spei.csic.es/spei_database_2_11/ via browser
    (the file listing isn't exposed to programmatic fetch). The spec text
    needs a corresponding DOI correction; track in a follow-up.
